name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v4-

      - name: Set up Android SDK
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
            unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          else
            echo "sdkmanager already present (from cache)"
          fi

          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK_ROOT/tools/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses 2>/dev/null || true

          if [ ! -d "$SDK_ROOT/platforms/android-33" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
              "platform-tools" \
              "build-tools;33.0.2" \
              "platforms;android-33"
          else
            echo "SDK packages already installed (from cache)"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

      - name: Set up Android NDK
        run: |
          NDK_DIR="$HOME/.buildozer/android/platform/android-ndk-r25b"

          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK r25b (~700 MB)..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
            echo "Extracting NDK..."
            unzip -q ndk.zip -d "$HOME/.buildozer/android/platform/"
            rm ndk.zip
            echo "NDK installed at $NDK_DIR"
          else
            echo "NDK already present (from cache)"
          fi

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          buildozer android debug 2>&1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Show Gradle logs on failure
        if: failure()
        run: |
          echo "=== Disk usage ==="
          df -h
          echo "=== Last 200 lines of buildozer build log ==="
          DIST_DIR=$(find ~/.buildozer -name "gradlew" 2>/dev/null | head -1 | xargs dirname)
          if [ -n "$DIST_DIR" ]; then
            echo "Gradle dist: $DIST_DIR"
            ls "$DIST_DIR"
          fi
          find ~/.buildozer .buildozer -name "*.log" 2>/dev/null | while read f; do
            echo "=== $f (last 100 lines) ==="
            tail -100 "$f"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-scanner-apk
          path: bin/*.apk
          retention-days: 30
